<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peripheral — Agenda</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="./agenda.css">
</head>
<body>
<!-- Fixed 1280x480. This page is rendered two ways from one source:
     (1) screenshotted by the daemon and pushed to the Trofeo panel over HID,
     (2) opened in a normal browser as the fallback when the panel is dead. -->
<main class="pane" id="pane">

  <!-- Three co-equal panels — logo / weather / time — mirroring the body
       grid below, not a logo with the clock and weather hung off its right
       edge. See CHANGELOG 2026-08-19: weather went through several rounds
       live before landing here (bar placement, then equal visual weight for
       all three weather stats, then dropping small "faint" captions
       entirely as illegible at 3ft). -->
  <header class="bar">
    <div class="bar-panel logo">
      <div class="mark"><span class="mark-glyph"></span>PERIPHERAL</div>
    </div>

    <div class="bar-panel weather">
      <div class="weather-stats" id="weatherStats"></div>
    </div>

    <div class="bar-panel time">
      <span class="badge" id="badge" hidden>STALE</span>
      <div class="time-figures">
        <span class="clock" id="clock">—</span>
        <span class="date-caption" id="dateCaption">—</span>
      </div>
    </div>
  </header>

  <div class="body">
    <section class="hero">
      <div class="eyebrow" id="heroEyebrow">Up next</div>
      <div class="countdown" id="countdown">—</div>
      <h1 class="title" id="title">—</h1>
      <div class="meta" id="meta"></div>
    </section>

    <!-- Same width as .hero (equal thirds) and reuses its typography on
         purpose — this is "up next" for whatever comes after the hero, and
         only appears while the hero is a live meeting. See renderThen(). -->
    <section class="then">
      <div class="eyebrow" id="thenEyebrow"></div>
      <div class="countdown" id="thenCountdown"></div>
      <h2 class="title" id="thenTitle"></h2>
      <div class="meta" id="thenMeta"></div>
    </section>

    <aside class="agenda">
      <div class="eyebrow">Today</div>
      <ul class="events" id="events"></ul>
    </aside>
  </div>

  <footer class="foot">
    <div class="progress"><span class="progress-fill" id="progress"></span></div>
  </footer>

</main>
<!-- type=module: agenda.js imports the hero logic from focus.js so that test/
     can reach it. Both are served over http, so ESM resolves fine. -->
<script type="module" src="./agenda.js"></script>
</body>
</html>
